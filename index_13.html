<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>部屋使用状況</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F5F7FA;
    --surface:#FFFFFF;
    --surface-2:#FAFBFC;
    --ink:#0F1419;
    --text:#1E2530;
    --muted:#6B7684;
    --line:#E4E9F0;
    --line-strong:#CED7E3;
    --accent:#4F46E5;
    --accent-soft:#EEEEFE;
    --busy:#D14842;
    --free:#0B9A6D;
    --radius:14px;
    --radius-sm:9px;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 4px 16px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0D1117;
      --surface:#151B23;
      --surface-2:#1A212B;
      --ink:#F2F5F9;
      --text:#E1E7EF;
      --muted:#8B96A7;
      --line:#242C38;
      --line-strong:#36434F;
      --accent:#8281F7;
      --accent-soft:#22224A;
      --busy:#F0776F;
      --free:#3BC99A;
      --shadow:0 1px 2px rgba(0,0,0,.32), 0 6px 20px rgba(0,0,0,.26);
    }
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Inter","Noto Sans JP",system-ui,sans-serif;
    font-size:14px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .mono{
    font-family:"JetBrains Mono",ui-monospace,monospace;
    font-variant-numeric:tabular-nums;
  }
  button{font-family:inherit;}

  /* ---------- 上部バー ---------- */
  .topbar{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--bg);
    border-bottom:1px solid var(--line);
  }
  @supports (backdrop-filter: blur(10px)){
    .topbar{
      background:color-mix(in srgb, var(--bg) 78%, transparent);
      backdrop-filter:saturate(170%) blur(12px);
      -webkit-backdrop-filter:saturate(170%) blur(12px);
    }
  }
  .bar-inner{
    max-width:1120px;
    margin:0 auto;
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .brand h1{
    margin:0;
    font-size:17px;
    font-weight:700;
    letter-spacing:-.01em;
    color:var(--ink);
    white-space:nowrap;
  }
  .pulse{
    width:8px;height:8px;border-radius:50%;
    background:var(--free);
    flex:none;
    animation:pulse 2.4s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(11,154,109,.45);}
    70%{box-shadow:0 0 0 7px rgba(11,154,109,0);}
    100%{box-shadow:0 0 0 0 rgba(11,154,109,0);}
  }
  .clock{text-align:right;line-height:1.25;}
  .clock-time{
    font-family:"JetBrains Mono",monospace;
    font-variant-numeric:tabular-nums;
    font-size:19px;
    font-weight:500;
    color:var(--ink);
    letter-spacing:-.02em;
  }
  .clock-date{font-size:11px;color:var(--muted);}

  main{
    max-width:1120px;
    margin:0 auto;
    padding:22px 20px 68px;
  }

  /* ---------- セグメント型コントロール ---------- */
  .seg{
    display:inline-flex;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:11px;
    padding:3px;
    gap:2px;
  }
  .seg-btn{
    appearance:none;
    border:none;
    background:transparent;
    color:var(--muted);
    font-size:13px;
    font-weight:500;
    padding:7px 15px;
    border-radius:8px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:7px;
    transition:background .15s, color .15s;
    white-space:nowrap;
  }
  .seg-btn:hover{color:var(--text);}
  .seg-btn.active{
    background:var(--surface);
    color:var(--ink);
    box-shadow:0 1px 2px rgba(16,24,40,.08);
    font-weight:600;
  }
  .seg-btn .n{
    font-family:"JetBrains Mono",monospace;
    font-size:10.5px;
    color:var(--muted);
    font-weight:400;
  }
  .seg-btn.active .n{color:var(--accent);}
  .seg-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .tabs{margin-bottom:18px;}

  /* ---------- 操作パネル ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 18px;
  }
  .controls{margin-bottom:16px;}
  .ctl-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .ctl-row + .ctl-row{
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .ctl-label{
    font-size:11px;
    font-weight:600;
    letter-spacing:.06em;
    color:var(--muted);
  }

  .search-wrap{position:relative;flex:1;min-width:190px;}
  .search-wrap input{
    width:100%;
    font-family:inherit;
    font-size:14px;
    padding:10px 13px 10px 36px;
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    background:var(--surface-2);
    color:var(--text);
    transition:border-color .15s, background .15s;
  }
  .search-wrap input::placeholder{color:var(--muted);}
  .search-wrap input:focus{
    outline:none;
    border-color:var(--accent);
    background:var(--surface);
  }
  .search-wrap svg{
    position:absolute;left:12px;top:50%;transform:translateY(-50%);
    width:15px;height:15px;color:var(--muted);pointer-events:none;
  }
  .btn{
    appearance:none;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--text);
    font-size:13px;
    font-weight:500;
    padding:9px 14px;
    border-radius:var(--radius-sm);
    cursor:pointer;
    transition:background .15s, border-color .15s;
    white-space:nowrap;
  }
  .btn:hover{background:var(--surface);border-color:var(--line-strong);}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* ---------- 時刻の操作行 ---------- */
  .timebar{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .mode{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:12.5px;
    color:var(--muted);
  }
  .mode .dot{width:7px;height:7px;border-radius:50%;background:var(--free);flex:none;}
  .timebar select, .timebar input[type="time"]{
    font-family:"JetBrains Mono",monospace;
    font-size:13px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    background:var(--surface);
    color:var(--text);
  }
  .timebar select:focus, .timebar input[type="time"]:focus{
    outline:none;border-color:var(--accent);
  }

  .status-line{
    font-size:12px;
    color:var(--muted);
    margin:0 0 16px;
  }
  .status-line.error{color:var(--busy);}

  /* ---------- カードをめくる演出 ---------- */
  .flip{
    perspective:900px;
  }
  .flip-inner{
    position:relative;
    transform-style:preserve-3d;
    transition:transform .45s cubic-bezier(.4,.2,.2,1);
  }
  .flip.flipped .flip-inner{transform:rotateY(180deg);}
  .flip-face{
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
  }
  .flip-back{
    position:absolute;
    inset:0;
    transform:rotateY(180deg);
    display:flex;
    flex-direction:column;
    gap:6px;
    justify-content:center;
    padding:11px 13px;
  }
  .rcard.flip{padding:0;}
  .rcard.flip .flip-inner{min-height:126px;}
  .rcard.flip .flip-face{padding:13px 14px 12px 17px;}
  .rcard.flip .flip-back{padding:11px 13px 11px 17px;}
  .rcard.clickable{cursor:pointer;}
  .flip-btn{
    appearance:none;
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    text-align:left;
    font-family:inherit;
    font-size:11.5px;
    font-weight:600;
    padding:7px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--surface-2);
    color:var(--text);
    cursor:pointer;
    transition:border-color .12s, background .12s, color .12s;
    overflow:hidden;
  }
  .flip-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--surface);}
  .flip-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .flip-btn .ic{
    width:15px;height:15px;flex:none;opacity:.65;
  }
  .flip-btn .lb{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .flip-close{
    align-self:flex-end;
    font-size:10.5px;
    color:var(--muted);
    background:none;
    border:none;
    cursor:pointer;
    padding:2px 4px;
    font-family:inherit;
  }
  .flip-close:hover{color:var(--text);}

  /* ---------- 絞り込み結果（詳細パネル） ---------- */
  .detail{
    background:var(--surface);
    border:1px solid var(--accent);
    border-radius:var(--radius);
    padding:14px 16px 12px;
    margin-bottom:16px;
  }
  .detail-head{
    display:flex;
    align-items:center;
    gap:9px;
    margin-bottom:11px;
    flex-wrap:wrap;
  }
  .detail-head .kind{
    font-size:10px;
    font-weight:700;
    padding:3px 8px;
    border-radius:20px;
    background:var(--accent-soft);
    color:var(--accent);
    letter-spacing:.03em;
  }
  .detail-head .subject{
    font-size:14px;
    font-weight:700;
    color:var(--ink);
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .detail-head .n{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    color:var(--muted);
  }
  .detail-close{
    margin-left:auto;
    appearance:none;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--muted);
    font-family:inherit;
    font-size:11.5px;
    padding:5px 11px;
    border-radius:7px;
    cursor:pointer;
  }
  .detail-close:hover{color:var(--text);border-color:var(--line-strong);}

  /* ---------- 授業検索の結果（近い順） ---------- */
  .hits{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px 12px;
    margin-bottom:16px;
  }
  .hits-head{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:10px;
  }
  .hits-head .n{
    font-family:"JetBrains Mono",monospace;
    font-weight:400;
    font-size:11px;
    color:var(--muted);
  }
  .hits-list{display:flex;flex-direction:column;gap:6px;}
  .hit{
    display:grid;
    grid-template-columns:70px 92px 1fr;
    align-items:center;
    gap:12px;
    padding:9px 12px;
    border:1px solid var(--line);
    border-radius:9px;
    background:var(--surface-2);
    cursor:pointer;
    text-align:left;
    width:100%;
    transition:border-color .13s, background .13s;
  }
  .hit:hover{border-color:var(--accent);background:var(--surface);}
  .hit:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .hit .rel{
    font-size:11px;
    font-weight:700;
    color:var(--muted);
    white-space:nowrap;
  }
  .hit.soon .rel{color:var(--busy);}
  .hit .when{
    font-family:"JetBrains Mono",monospace;
    font-size:12.5px;
    font-weight:700;
    color:var(--accent);
    white-space:nowrap;
  }
  .hit .when small{
    display:block;
    font-weight:400;
    font-size:10px;
    color:var(--muted);
  }
  .hit .what{min-width:0;}
  .hit .cls{
    font-size:12.5px;
    font-weight:600;
    color:var(--ink);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .hit .where{
    font-size:11px;
    color:var(--muted);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .hit .where b{
    font-family:"JetBrains Mono",monospace;
    font-weight:700;
    color:var(--text);
  }
  .hits-more{font-size:11.5px;color:var(--muted);margin-top:9px;}
  .hits-none{
    font-size:12.5px;
    color:var(--muted);
    padding:2px 0 2px;
  }

  /* 一覧表で検索に一致したマスを強調 */
  td.slot.hit-cell{
    outline:2px solid var(--accent);
    outline-offset:-2px;
  }

  @media (max-width:640px){
    .hit{grid-template-columns:58px 1fr;gap:9px;}
    .hit .when{grid-column:1;}
    .hit .rel{grid-column:1;font-size:10px;}
    .hit .what{grid-column:2;grid-row:1 / span 2;}
  }

  /* ---------- 表示切り替え行 ---------- */
  .view-row{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:4px;
  }

  /* ---------- 一覧表（部屋 × 時限） ---------- */
  .matrix-wrap{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:auto;
    margin-top:16px;
  }
  table.matrix{
    width:100%;
    border-collapse:collapse;
    font-size:12.5px;
  }
  table.matrix th, table.matrix td{
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:0;
    text-align:center;
  }
  table.matrix th:last-child, table.matrix td:last-child{border-right:none;}
  table.matrix tbody tr:last-child td{border-bottom:none;}
  table.matrix thead th{
    background:var(--surface-2);
    color:var(--muted);
    font-size:11.5px;
    font-weight:600;
    padding:10px 8px;
    position:sticky;
    top:0;
    z-index:1;
  }
  table.matrix thead th.now{color:var(--accent);}
  table.matrix td.mroom{
    background:var(--surface-2);
    text-align:left;
    padding:8px 12px;
    white-space:nowrap;
    position:sticky;
    left:0;
    z-index:1;
  }
  table.matrix td.mroom .n{
    font-family:"JetBrains Mono",monospace;
    font-weight:700;
    color:var(--ink);
    font-size:13px;
  }
  table.matrix td.slot{
    padding:7px 8px;
    line-height:1.35;
  }
  td.slot.busy{background:rgba(209,72,66,.09);}
  td.slot.free{background:rgba(11,154,109,.07);}
  @media (prefers-color-scheme: dark){
    td.slot.busy{background:rgba(240,119,111,.13);}
    td.slot.free{background:rgba(59,201,154,.10);}
  }
  td.slot .mark{
    font-size:12px;
    font-weight:700;
    display:block;
  }
  td.slot.busy .mark{color:var(--busy);}
  td.slot.free .mark{color:var(--free);}
  td.slot .sub{
    font-size:10.5px;
    color:var(--muted);
    display:block;
    max-width:150px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    margin:0 auto;
  }
  .legend{
    display:flex;
    gap:14px;
    align-items:center;
    font-size:11.5px;
    color:var(--muted);
    margin-top:10px;
    flex-wrap:wrap;
  }
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .legend .lb{background:rgba(209,72,66,.35);}
  .legend .lf{background:rgba(11,154,109,.3);}

  /* ---------- 部屋カード ---------- */
  .sec-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin:22px 0 12px;
  }
  .sec-head h3{
    margin:0;
    font-size:12px;
    font-weight:700;
    letter-spacing:.08em;
  }
  .sec-head.busy h3{color:var(--busy);}
  .sec-head.free h3{color:var(--free);}
  .sec-head .n{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    color:var(--muted);
  }
  .sec-head::after{content:"";flex:1;height:1px;background:var(--line);}

  .grid-cards{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(215px, 1fr));
    gap:11px;
  }
  .rcard{
    position:relative;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:13px 14px 12px 17px;
    overflow:hidden;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .rcard::before{
    content:"";
    position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--free);
  }
  .rcard.busy::before{background:var(--busy);}
  .rcard:hover{
    transform:translateY(-1px);
    box-shadow:var(--shadow);
    border-color:var(--line-strong);
  }
  .rcard-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:9px;
  }
  .rname{
    font-family:"JetBrains Mono",monospace;
    font-size:15px;
    font-weight:700;
    color:var(--ink);
    letter-spacing:-.02em;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .bldg{
    font-size:10px;
    font-weight:600;
    padding:2.5px 7px;
    border-radius:20px;
    flex:none;
  }
  .bldg-lecture{background:var(--accent-soft);color:var(--accent);}
  .bldg-lab{background:rgba(11,154,109,.12);color:var(--free);}
  .bldg-other{background:var(--surface-2);color:var(--muted);border:1px solid var(--line);}

  .rstate{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:11.5px;
    font-weight:600;
    margin-bottom:6px;
  }
  .rstate .pip{width:6px;height:6px;border-radius:50%;}
  .rcard.busy .rstate{color:var(--busy);}
  .rcard.busy .pip{background:var(--busy);}
  .rcard.free .rstate{color:var(--free);}
  .rcard.free .pip{background:var(--free);}

  .rtitle{
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    line-height:1.4;
    margin-bottom:3px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .rmeta{font-size:11.5px;color:var(--muted);line-height:1.45;}
  .rmeta .time{font-family:"JetBrains Mono",monospace;}
  .rnext{font-size:11.5px;color:var(--muted);}
  .rnext .time{font-family:"JetBrains Mono",monospace;}

  .empty-note{
    text-align:center;
    padding:34px 16px;
    color:var(--muted);
    font-size:13px;
    background:var(--surface);
    border:1px dashed var(--line-strong);
    border-radius:var(--radius);
    margin:0;
  }

  /* ---------- 部屋の選択 ---------- */
  .room-group + .room-group{margin-top:18px;}
  .room-group-title{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.07em;
    color:var(--muted);
    margin-bottom:9px;
  }
  .room-group-title::after{content:"";flex:1;height:1px;background:var(--line);}
  .room-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .room-chip{
    font-family:"JetBrains Mono",monospace;
    font-size:12.5px;
    padding:7px 12px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--text);
    cursor:pointer;
    transition:background .13s, border-color .13s, color .13s;
  }
  .room-chip:hover{border-color:var(--accent);color:var(--accent);}
  .room-chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .room-chip.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:500;
  }

  /* ---------- 週間時間割 ---------- */
  .room-head{
    display:flex;
    align-items:center;
    gap:11px;
    margin:26px 0 12px;
    flex-wrap:wrap;
  }
  .rh-name{
    font-family:"JetBrains Mono",monospace;
    font-size:22px;
    font-weight:700;

<script>
/* =========================================================
   設定
========================================================= */
const EXCEL_FILE = "schedule.xlsx";
const SHEET_NAME = "時間割";
const DAYS = ["月","火","水","木","金"]; // この大学は月〜金のみ運用
const ALL_DAY_NAMES = ["日","月","火","水","木","金","土"];

// この大学の時限
const PERIODS = [
  {n:1, start:"08:50", end:"10:20"},
  {n:2, start:"10:30", end:"12:00"},
  {n:3, start:"13:00", end:"14:30"},
  {n:4, start:"14:40", end:"16:10"},
  {n:5, start:"16:20", end:"17:50"},
];

let entries = [];
let rooms = [];
let selectedRoom = null;
let searchTerm = "";        // 部屋名・担当者名での絞り込み
let classQuery = "";        // 授業名での検索（近い順の一覧に使う）
let statusFilter = "all";   // all | inuse | free
let buildingFilter = "all"; // all | lecture | lab | other
let periodFilter = "now";   // now | "1"〜"5"
let viewMode = "cards";     // cards | matrix

/* ---------- 建物の判定 ----------
   1101 のような数字4桁 → 講義棟
   S201 のように先頭がアルファベット＋数字 → 研究棟
   それ以外（端末講義室、MILAiS など） → その他            */
const BUILDINGS = {lecture:"講義棟", lab:"研究棟", other:"その他"};

function buildingOf(room){
  if(/^\d{4}$/.test(room)) return "lecture";
  if(/^[A-Za-z]\d{3}/.test(room)) return "lab";
  return "other";
}

/* 講義棟 → 研究棟 → その他 の順、棟の中は番号順 */
function compareRooms(a, b){
  const order = {lecture:0, lab:1, other:2};
  const ba = buildingOf(a), bb = buildingOf(b);
  if(order[ba] !== order[bb]) return order[ba] - order[bb];

  if(ba === "lecture") return Number(a) - Number(b);
  if(ba === "lab"){
    const ma = a.match(/^([A-Za-z])(\d+)/);
    const mb = b.match(/^([A-Za-z])(\d+)/);
    const la = ma[1].toUpperCase(), lb = mb[1].toUpperCase();
    if(la !== lb) return la < lb ? -1 : 1;
    const na = Number(ma[2]), nb = Number(mb[2]);
    if(na !== nb) return na - nb;
  }
  return a.localeCompare(b, "ja");
}

function visibleRooms(){
  let list = rooms;
  if(buildingFilter !== "all"){
    list = list.filter(r => buildingOf(r) === buildingFilter);
  }
  if(searchTerm){
    const q = searchTerm.toLowerCase();
    list = list.filter(r =>
      r.toLowerCase().includes(q) ||
      entries.some(e => e.room === r && e.owner.toLowerCase().includes(q))
    );
  }
  return list;
}

/* 現在時刻表示モード */
let liveMode = true;
let viewDayIndex = 0;
let viewTime = "00:00";

/* =========================================================
   時刻ユーティリティ
========================================================= */
function pad2(n){ return n.toString().padStart(2,"0"); }

function nowHM(){
  const d = new Date();
  return pad2(d.getHours())+":"+pad2(d.getMinutes());
}

function todayDaysIndex(){
  const jsday = new Date().getDay(); // 0=日,1=月,...6=土
  const idx = jsday - 1;
  return (idx >= 0 && idx <= 4) ? idx : -1; // -1 は土日
}

function toMinutes(hm){
  const [h,m] = hm.split(":").map(Number);
  return h*60+m;
}

function isNowWithin(startHM, endHM, targetHM){
  const t = toMinutes(targetHM);
  return t >= toMinutes(startHM) && t < toMinutes(endHM);
}

/* 判定に使う時刻。時限が選ばれていればその時限の開始時刻を使う */
function effectiveTime(){
  if(periodFilter === "now") return viewTime;
  const p = PERIODS[Number(periodFilter) - 1];
  return p ? p.start : viewTime;
}

/* その時刻が何限にあたるかを返す（授業時間外はnull） */
function periodOf(hm){
  const p = PERIODS.find(x => isNowWithin(x.start, x.end, hm));
  return p ? p.n : null;
}

/* 今まさに進行中の時間帯を見ているか。
   （今を見ていれば「使用中」、先の時間や別の曜日を見ていれば「使用予定」と表示する） */
function viewIsNow(){
  const todayIdx = todayDaysIndex();
  if(todayIdx < 0) return false;                 // 土日はデータなし
  if(liveMode && periodFilter === "now") return true;
  if(viewDayIndex !== todayIdx) return false;    // 別の曜日を見ている
  const pv = periodOf(effectiveTime());
  const pn = periodOf(nowHM());
  return pv !== null && pv === pn;               // 今と同じ時限を見ている
}

/* 使用中／使用予定 の表示文言 */
function busyWord(){
  return viewIsNow() ? "使用中" : "使用予定";
}

/* その部屋・曜日・時間帯に入っている授業を返す */
function classAt(room, day, time){
  if(!day) return null;
  return entries.find(e =>
    e.room === room && e.day === day && isNowWithin(e.start, e.end, time)
  ) || null;
}

/* =========================================================
   Excel読み込み
========================================================= */
// 「1限」のような時限表記を実時刻に変換（時限表記でなければnull）
function resolvePeriodTime(v, endpoint){
  if(v === "" || v === null || v === undefined) return null;
  const s = String(v).trim();
  const m = s.match(/^([1-5])\s*限?$/);
  if(!m) return null;
  const p = PERIODS[Number(m[1]) - 1];
  return p ? p[endpoint] : null;
}

// 時刻シリアル値もHH:MMに正規化
function normalizeTime(v){
  if(v === "" || v === null || v === undefined) return "";
  if(typeof v === "number"){
    const totalMinutes = Math.round(v * 24 * 60);
    const h = Math.floor(totalMinutes/60) % 24;
    const m = totalMinutes % 60;
    return pad2(h)+":"+pad2(m);
  }
  const s = String(v).trim();
  const m = s.match(/^(\d{1,2}):(\d{2})/);
  if(m) return pad2(Number(m[1]))+":"+m[2];
  return s;
}

function resolveTimeField(v, endpoint){
  return resolvePeriodTime(v, endpoint) || normalizeTime(v);
}

async function loadSchedule(){
  const statusEl = document.getElementById("status-line");
  try{
    const res = await fetch(EXCEL_FILE, {cache:"no-store"});
    if(!res.ok) throw new Error("ファイルが見つかりません: " + EXCEL_FILE);
    const buf = await res.arrayBuffer();
    const wb = XLSX.read(buf, {type:"array"});
    const sheet = wb.Sheets[SHEET_NAME];
    if(!sheet) throw new Error(`シート「${SHEET_NAME}」が見つかりません`);
    const rows = XLSX.utils.sheet_to_json(sheet, {defval:""});

    entries = rows.map(r => {
      const room = String(r["部屋"] ?? "").trim();
      const day = String(r["曜日"] ?? "").trim();
      let start = "", end = "";

      // 新形式: 「時限」列（1〜5）
      const periodRaw = r["時限"];
      if(periodRaw !== undefined && periodRaw !== null && String(periodRaw).trim() !== ""){
        const n = parseInt(String(periodRaw).trim(), 10);
        const p = PERIODS[n - 1];
        if(p){ start = p.start; end = p.end; }
      }
      // 旧形式: 「開始」「終了」列
      if(!start || !end){
        start = resolveTimeField(r["開始"], "start");
        end = resolveTimeField(r["終了"], "end");
      }

      return {
        room, day, start, end,
        content: String(r["内容"] ?? "").trim(),
        owner: String(r["担当者"] ?? "").trim(),
      };
    }).filter(e => e.room && e.day && e.start && e.end);

    rooms = [...new Set(entries.map(e => e.room))].sort(compareRooms);
    selectedRoom = rooms[0] || null;

    statusEl.textContent = `${entries.length}件の予定 / ${rooms.length}部屋を読み込みました`;
    statusEl.classList.remove("error");

    updateBuildingCounts();
    buildRoomChips();
    renderRoomTable();
    renderBoard(true);
  }catch(err){
    statusEl.textContent = "読み込めませんでした: " + err.message + "（schedule.xlsx が index.html と同じ場所にあるか確認してください）";
    statusEl.classList.add("error");
    console.error(err);
  }
}

/* =========================================================
   時計・時刻ピッカー
========================================================= */
function tickClock(){
  const d = new Date();
  document.getElementById("clockTime").textContent =
    pad2(d.getHours())+":"+pad2(d.getMinutes())+":"+pad2(d.getSeconds());
  document.getElementById("clockDate").textContent =
    `${d.getFullYear()}.${pad2(d.getMonth()+1)}.${pad2(d.getDate())} (${ALL_DAY_NAMES[d.getDay()]})`;

  if(liveMode && periodFilter === "now"){
    viewDayIndex = todayDaysIndex();
    viewTime = nowHM();
    renderBoard();
  }
}

function syncPickers(){
  const dayPicker = document.getElementById("dayPicker");
  dayPicker.value = viewDayIndex >= 0 ? viewDayIndex : 0;
  document.getElementById("timePicker").value = viewTime;
}

function setupPickers(){
  const dayPicker = document.getElementById("dayPicker");
  DAYS.forEach((d,i)=>{
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = d + "曜日";
    dayPicker.appendChild(opt);
  });
  syncPickers();

  dayPicker.addEventListener("change", ()=>{
    liveMode = false;
    viewDayIndex = Number(dayPicker.value);
    updateModeLabel();
    renderBoard(true);
  });
  document.getElementById("timePicker").addEventListener("change", (e)=>{
    liveMode = false;
    viewTime = e.target.value || "00:00";
    resetPeriodButtons(); // 時刻を直接指定したら時限の選択は解除する
    updateModeLabel();
    renderBoard(true);
  });
  document.getElementById("btnNow").addEventListener("click", ()=>{
    liveMode = true;
    viewDayIndex = todayDaysIndex();
    viewTime = nowHM();
    resetPeriodButtons();
    syncPickers();
    updateModeLabel();
    renderBoard(true);
  });
}

function updateModeLabel(){
  const label = document.getElementById("modeLabel");
  const dot = document.getElementById("liveDot");
  if(periodFilter !== "now"){
    const p = PERIODS[Number(periodFilter) - 1];
    label.textContent = `${DAYS[viewDayIndex]}曜日 ${p.n}限（${p.start}–${p.end}）を表示中`;
    dot.style.background = "var(--accent)";
    return;
  }
  if(liveMode){
    label.textContent = viewDayIndex === -1
      ? "現在時刻を表示中（本日は土日のため授業はありません）"
      : "現在時刻を表示中";
    dot.style.background = "var(--free)";
  }else{
    label.textContent = `${DAYS[viewDayIndex]}曜日 ${viewTime} を表示中`;
    dot.style.background = "var(--accent)";
  }
}

/* =========================================================
   現在の状況
========================================================= */
function nextClassOf(room, day, time){
  if(!day) return null;
  const t = toMinutes(time);
  const later = entries
    .filter(e => e.room === room && e.day === day && toMinutes(e.start) > t)
    .sort((a,b) => toMinutes(a.start) - toMinutes(b.start));
  return later[0] || null;
}

/* 直前に描画した状態。内容が変わっていなければ描き直さない
   （1秒ごとの時計更新で表を作り直すと、横スクロール位置が戻ってしまうため） */
let lastRenderKey = "";
let matrixScrollLeft = 0; // 一覧表の横スクロール位置

function renderBoard(force){
  const list = document.getElementById("boardList");

  // 今の表示条件をひとつの文字列にまとめて、前回と比べる
  const targetDayKey = viewDayIndex >= 0 ? DAYS[viewDayIndex] : "-";
  const t0 = effectiveTime();
  // カード表示は「あと◯分」が毎分変わるので分単位まで、
  // 一覧表は時限単位でしか変わらないので時限までを比較対象にする
  const timeKey = viewMode === "matrix" ? String(periodOf(t0)) : t0;
  const key = [
    viewMode, targetDayKey, timeKey, statusFilter, buildingFilter,
    searchTerm, classQuery, viewIsNow(), rooms.length
  ].join("|");

  if(!force && key === lastRenderKey) return;

  // 曜日や絞り込みが変わったときは、表を左端から見せる
  const prevScope = lastRenderKey.split("|").slice(1, 7).join("|");
  const nowScope  = key.split("|").slice(1, 7).join("|");
  if(lastRenderKey && prevScope !== nowScope) matrixScrollLeft = 0;

  lastRenderKey = key;

  list.innerHTML = "";

  if(rooms.length === 0) return;

  const visible = visibleRooms();
  if(visible.length === 0){
    list.innerHTML = `<p class="empty-note">条件に合う部屋が見つかりません。検索語や建物の絞り込みを変えてみてください。</p>`;
    return;
  }

  if(viewMode === "matrix"){
    renderMatrix(list, visible);
    return;
  }

  const targetDay = viewDayIndex >= 0 ? DAYS[viewDayIndex] : null;
  const t = effectiveTime();
  const word = busyWord();
  const isNow = viewIsNow();
  const inUse = [], free = [];
  visible.forEach(room => {
    const match = classAt(room, targetDay, t);
    (match ? inUse : free).push({room, match});
  });

  // 絞り込みボタンの文言も表示に合わせる
  const inuseBtn = document.querySelector("#statusFilter .seg-btn[data-status='inuse']");
  if(inuseBtn) inuseBtn.textContent = word;

  function card(room, match){
    const el = document.createElement("article");
    el.className = "rcard " + (match ? "busy" : "free");

    const bld = buildingOf(room);
    let body;
    if(match){
      // 今を見ているときの「あと◯分」は、実際の現在時刻から数える
      const ref = isNow ? nowHM() : t;
      const left = toMinutes(match.end) - toMinutes(ref);
      body =
        `<div class="rstate"><span class="pip"></span>${word}</div>` +
        `<div class="rtitle">${escapeHtml(match.content) || "（内容未設定）"}</div>` +
        `<div class="rmeta">${match.owner ? escapeHtml(match.owner) + " · " : ""}<span class="time">${match.start}–${match.end}</span></div>` +
        (isNow && left > 0 ? `<div class="rnext">あと${left}分</div>` : "");
    }else{
      const next = targetDay ? nextClassOf(room, targetDay, t) : null;
      body =
        `<div class="rstate"><span class="pip"></span>空室</div>` +
        `<div class="rnext">${next
          ? `次は <span class="time">${next.start}</span> から`
          : (targetDay ? "この後の予定はありません" : "土日は授業がありません")}</div>`;
    }

    const front =
      `<div class="rcard-top">` +
        `<span class="rname">${escapeHtml(room)}</span>` +
        `<span class="bldg bldg-${bld}">${BUILDINGS[bld]}</span>` +
      `</div>` + body;

    if(!match){
      // 空室のカードはめくらず、部屋の時間割だけ見られるようにする
      el.classList.add("clickable");
      el.innerHTML = front;
      el.addEventListener("click", ()=> showDetail("room", room));
      return el;
    }

    // 授業が入っているカードは、押すとめくれて3つのボタンが出る
    el.classList.add("clickable", "flip");
    const inner = document.createElement("div");
    inner.className = "flip-inner";

    const face = document.createElement("div");
    face.className = "flip-face";
    face.innerHTML = front;

    const back = document.createElement("div");
    back.className = "flip-face flip-back";
    back.appendChild(makeFlipButtons(room, match, ()=>{
      el.classList.remove("flipped");
    }));

    inner.appendChild(face);
    inner.appendChild(back);
    el.appendChild(inner);

    el.addEventListener("click", (ev)=>{
      if(ev.target.closest(".flip-btn") || ev.target.closest(".flip-close")) return;
      el.classList.toggle("flipped");
    });
    return el;
  }

  function section(title, cls, items){
    if(items.length === 0) return;
    const head = document.createElement("div");
    head.className = "sec-head " + cls;
    head.innerHTML = `<h3>${title}</h3><span class="n">${items.length}</span>`;
    list.appendChild(head);

    const grid = document.createElement("div");
    grid.className = "grid-cards";
    items.forEach(({room, match}) => grid.appendChild(card(room, match)));
    list.appendChild(grid);
  }

  if(statusFilter === "all"){
    section(word, "busy", inUse);
    section("空室", "free", free);
  }else if(statusFilter === "inuse"){
    if(inUse.length === 0){
      list.innerHTML = `<p class="empty-note">この時間に${word}の部屋はありません。</p>`;
    }else{
      section(word, "busy", inUse);
    }
  }else{
    if(free.length === 0){
      list.innerHTML = `<p class="empty-note">この時間に空いている部屋はありません。</p>`;
    }else{
      section("空室", "free", free);
    }
  }
}

/* ---------- 一覧表（部屋 × 1〜5限） ---------- */
function renderMatrix(list, visible){
  const targetDay = viewDayIndex >= 0 ? DAYS[viewDayIndex] : null;

  if(!targetDay){
    list.innerHTML = `<p class="empty-note">土日は授業がありません。曜日を選ぶとその日の一覧を表示します。</p>`;
    return;
  }

  // 状態で絞り込む場合は、選んだ時限（現在なら現在時刻）での状態で判定する
  const t = effectiveTime();
  let target = visible;
  if(statusFilter !== "all"){
    target = visible.filter(room => {
      const busy = !!classAt(room, targetDay, t);
      return statusFilter === "inuse" ? busy : !busy;
    });
  }

  if(target.length === 0){
    list.innerHTML = `<p class="empty-note">${statusFilter === "inuse"
      ? `この時間に${busyWord()}の部屋はありません。` : "この時間に空いている部屋はありません。"}</p>`;
    return;
  }

  // 今この瞬間が何限か（今日を見ているときだけ「使用中」と表示する）
  const todayIdx = todayDaysIndex();
  const nowPeriod = (todayIdx >= 0 && viewDayIndex === todayIdx) ? periodOf(nowHM()) : null;

  const table = document.createElement("table");
  table.className = "matrix";

  const activeP = periodFilter === "now" ? currentPeriodNumber() : Number(periodFilter);

  const thead = document.createElement("thead");
  thead.innerHTML = "<tr><th style=\"text-align:left;padding-left:12px\">部屋</th>" +
    PERIODS.map(p => `<th class="${p.n === activeP ? "now" : ""}">${p.n}限<br><span style="font-weight:400;font-size:10px">${p.start}</span></th>`).join("") +
    "</tr>";
  table.appendChild(thead);

  const tbody = document.createElement("tbody");
  target.forEach(room => {
    const tr = document.createElement("tr");
    const bld = buildingOf(room);
    const rc = document.createElement("td");
    rc.className = "mroom";
    rc.innerHTML = `<span class="n">${escapeHtml(room)}</span> <span class="bldg bldg-${bld}">${BUILDINGS[bld]}</span>`;
    tr.appendChild(rc);

    PERIODS.forEach(p => {
      const m = classAt(room, targetDay, p.start);
      const td = document.createElement("td");
      td.className = "slot " + (m ? "busy" : "free");
      if(m){
        // その時限が今まさに進行中なら「使用中」、そうでなければ「使用予定」
        const word = (p.n === nowPeriod) ? "使用中" : "使用予定";
        td.innerHTML = `<span class="mark">${word}</span><span class="sub">${escapeHtml(m.content)}</span>`;
        td.title = m.content + (m.owner ? "（" + m.owner + "）" : "");
        // 授業検索の語に一致したマスを強調する
        if(classQuery){
          const q = classQuery.toLowerCase();
          if(m.content.toLowerCase().includes(q)){
            td.classList.add("hit-cell");
          }
        }
      }else{
        td.innerHTML = `<span class="mark">空</span>`;
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);

  const box = document.createElement("div");
  box.className = "matrix-wrap";
  box.appendChild(table);
  list.appendChild(box);

  // 描き直しても横スクロール位置が戻らないようにする
  box.scrollLeft = matrixScrollLeft;
  box.addEventListener("scroll", ()=>{ matrixScrollLeft = box.scrollLeft; });

  const legend = document.createElement("div");
  legend.className = "legend";
  legend.innerHTML =
    `<span><i class="lf"></i>空室</span><span><i class="lb"></i>使用中／使用予定</span>` +
    `<span>${targetDay}曜日 / ${target.length}部屋</span>`;
  list.appendChild(legend);
}

/* 現在時刻が何限かを返す（授業時間外は0） */
function currentPeriodNumber(){
  const t = viewTime;
  const p = PERIODS.find(x => isNowWithin(x.start, x.end, t));
  return p ? p.n : 0;
}

function makeFlipButtons(room, session, onClose){
  const box = document.createElement("div");
  box.style.display = "flex";
  box.style.flexDirection = "column";
  box.style.gap = "6px";

  function add(kind, label, value){
    const b = document.createElement("button");
    b.type = "button";
    b.className = "flip-btn";
    b.innerHTML = ICONS[kind] + `<span class="lb">${escapeHtml(label)}</span>`;
    b.addEventListener("click", (ev)=>{
      ev.stopPropagation();

      if(onClose) onClose();
    });

  }

  const close = document.createElement("button");
  close.type = "button";
  close.className = "flip-close";
  close.textContent = "閉じる";
  close.addEventListener("click", (ev)=>{ ev.stopPropagation(); if(onClose) onClose(); });
  box.appendChild(close);

  return box;
}

/* ---------- 詳細パネル（教室／授業／担当者で絞った結果） ---------- */
function showDetail(kind, value){
  const wrap = document.getElementById("detailPanel");
  wrap.innerHTML = "";

  let items = [];
  let kindLabel = "";
  let subject = value;

  if(kind === "room"){
    kindLabel = "この教室の時間割";
    // 今日（土日なら月曜）の予定を時限順に
    const ti = todayDaysIndex();
    const day = ti >= 0 ? DAYS[ti] : DAYS[0];
    items = entries.filter(e => e.room === value && e.day === day)
                   .sort((a,b) => toMinutes(a.start) - toMinutes(b.start));
    subject = `${value}（${day}曜日）`;
  }else if(kind === "class"){
    kindLabel = "この授業の他の時間";
    items = entries.filter(e => e.content === value);
  }else{
    kindLabel = "この担当者の授業";
    items = entries.filter(e => e.owner === value);
  }

  if(kind !== "room"){
    // 今から近い順に並べる
    items = items.map(e => ({e, mins: minutesUntil(e)}))
                 .sort((a,b) => (a.mins - b.mins) || compareRooms(a.e.room, b.e.room))
                 .map(x => x.e);
  }

  const box = document.createElement("div");
  box.className = "detail";

  const head = document.createElement("div");
  head.className = "detail-head";
  head.innerHTML =
    `<span class="kind">${kindLabel}</span>` +
    `<span class="subject">${escapeHtml(subject)}</span>` +
    `<span class="n">${items.length}件</span>`;
  const closeBtn = document.createElement("button");
  closeBtn.type = "button";
  closeBtn.className = "detail-close";
  closeBtn.textContent = "閉じる";
  closeBtn.addEventListener("click", ()=>{ wrap.innerHTML = ""; });
  head.appendChild(closeBtn);
  box.appendChild(head);

  if(items.length === 0){
    const none = document.createElement("p");
    none.className = "hits-none";
    none.textContent = kind === "room"
      ? "この日は予定がありません。"
      : "他に予定は見つかりませんでした。";
    box.appendChild(none);
  }else{
    const list = document.createElement("div");
    list.className = "hits-list";
    items.forEach(e => {
      const p = PERIODS.find(x => x.start === e.start);
      const mins = minutesUntil(e);
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "hit" + (mins < 120 ? " soon" : "");
      btn.innerHTML =
        `<span class="rel">${kind === "room" ? "" : relativeLabel(e, mins)}</span>` +
        `<span class="when">${e.day}曜 ${p ? p.n + "限" : ""}<small>${e.start}–${e.end}</small></span>` +
        `<span class="what">` +
          `<span class="cls">${escapeHtml(e.content)}</span>` +
          `<span class="where"><b>${escapeHtml(e.room)}</b>${e.owner ? " · " + escapeHtml(e.owner) : ""}</span>` +
        `</span>`;
      btn.addEventListener("click", ()=> jumpTo(e));
      list.appendChild(btn);
    });
    box.appendChild(list);
  }

  wrap.appendChild(box);
  wrap.scrollIntoView({behavior:"smooth", block:"nearest"});
}

function jumpTo(e){
  const p = PERIODS.find(x => x.start === e.start);
  const di = DAYS.indexOf(e.day);
  if(di >= 0) viewDayIndex = di;
  liveMode = false;
  if(p){

  });

  syncPickers();
  updateModeLabel();
  renderBoard(true);
}

/* ---------- 授業検索（今から近い順に表示） ---------- */

const WEEK_MIN = 7 * 1440;

/* 今から見て、その授業が始まるまでの分数。進行中なら0 */
function minutesUntil(e){
  const di = DAYS.indexOf(e.day);
  if(di < 0) return Infinity;
  const ti = todayDaysIndex();
  const sess = di * 1440 + toMinutes(e.start);

  if(ti < 0){
    // 土日は「次の月曜0:00」を起点にする
    return sess;
  }
  const now = ti * 1440 + toMinutes(nowHM());
  if(e.day === DAYS[ti] && isNowWithin(e.start, e.end, nowHM())) return 0; // 進行中
  return ((sess - now) % WEEK_MIN + WEEK_MIN) % WEEK_MIN;
}

/* 「実施中」「あと◯分」「今日」「明日」などの表示 */
function relativeLabel(e, mins){
  if(mins === 0) return "実施中";
  if(mins < 60) return `あと${mins}分`;
  const ti = todayDaysIndex();
  if(ti < 0) return "";
  const startOfToday = ti * 1440;
  const sess = DAYS.indexOf(e.day) * 1440 + toMinutes(e.start);
  const offset = Math.floor((((sess - startOfToday) % WEEK_MIN + WEEK_MIN) % WEEK_MIN) / 1440);
  if(offset === 0) return `今日 あと${Math.floor(mins/60)}時間`;
  if(offset === 1) return "明日";
  return `${offset}日後`;
}

/* 検索語を含む授業を、今から近い順に並べて返す */
function matchedSessions(){
  if(!classQuery) return [];
  const q = classQuery.toLowerCase();
  let hits = entries.filter(e => e.content.toLowerCase().includes(q));
  if(buildingFilter !== "all"){
    hits = hits.filter(e => buildingOf(e.room) === buildingFilter);
  }
  return hits
    .map(e => ({e, mins: minutesUntil(e)}))
    .sort((a,b) => (a.mins - b.mins) || compareRooms(a.e.room, b.e.room));
}

const HITS_LIMIT = 30;

function renderClassHits(){
  const wrap = document.getElementById("classHits");
  wrap.innerHTML = "";
  if(!classQuery) return;

  const hits = matchedSessions();

  const box = document.createElement("div");
  box.className = "hits";

  const head = document.createElement("div");
  head.className = "hits-head";
  head.innerHTML = `<span>「${escapeHtml(classQuery)}」を含む授業</span>` +
    (hits.length ? `<span class="n">${hits.length}件 · 近い順</span>` : "");
  box.appendChild(head);

  if(hits.length === 0){
    const none = document.createElement("p");
    none.className = "hits-none";
    none.textContent = "一致する授業が見つかりません。別の言葉で試してみてください。";
    box.appendChild(none);
    wrap.appendChild(box);
    return;
  }

  const list = document.createElement("div");
  list.className = "hits-list";

  hits.slice(0, HITS_LIMIT).forEach(({e, mins}) => {
    const p = PERIODS.find(x => x.start === e.start);
    const rel = relativeLabel(e, mins);

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "hit" + (mins < 120 ? " soon" : "");
    btn.innerHTML =
      `<span class="rel">${rel}</span>` +
      `<span class="when">${e.day}曜 ${p ? p.n + "限" : ""}<small>${e.start}–${e.end}</small></span>` +
      `<span class="what">` +
        `<span class="cls">${escapeHtml(e.content)}</span>` +
        `<span class="where"><b>${escapeHtml(e.room)}</b>${e.owner ? " · " + escapeHtml(e.owner) : ""}</span>` +
      `</span>`;

    btn.addEventListener("click", ()=>{
      // その授業の曜日・時限に移動して、現在の状況タブを開く
      const di = DAYS.indexOf(e.day);
      if(di >= 0) viewDayIndex = di;
      liveMode = false;
      if(p){
        periodFilter = String(p.n);
        viewTime = p.start;
      }else{
        periodFilter = "now";
        viewTime = e.start;
      }
      document.querySelectorAll("#periodFilter .seg-btn").forEach(b=>{
        b.classList.toggle("active", b.dataset.period === periodFilter);
      });
      document.querySelectorAll("#tabs .seg-btn").forEach(b=>{
        const on = b.dataset.panel === "panel-now";
        b.classList.toggle("active", on);
      });
      document.querySelectorAll(".panel").forEach(pl=>{ pl.hidden = pl.id !== "panel-now"; });
      syncPickers();
      updateModeLabel();
      renderBoard(true);
    });
    list.appendChild(btn);
  });

  box.appendChild(list);

  if(hits.length > HITS_LIMIT){
    const more = document.createElement("div");
    more.className = "hits-more";
    more.textContent = `ほか${hits.length - HITS_LIMIT}件あります。検索語をもう少し詳しく入れると絞り込めます。`;
    box.appendChild(more);
  }

  wrap.appendChild(box);
}

function buildRoomChips(){

function renderRoomTable(){
  const wrap = document.getElementById("roomTableWrap");
  wrap.innerHTML = "";
  if(!selectedRoom) return;

  const roomEntries = entries.filter(e => e.room === selectedRoom);
  const bld = buildingOf(selectedRoom);

  const head = document.createElement("div");
  head.className = "room-head";
  head.innerHTML =
    `<span class="rh-name">${escapeHtml(selectedRoom)}</span>` +
    `<span class="bldg bldg-${bld}">${BUILDINGS[bld]}</span>` +
    `<span class="rh-sub">週${roomEntries.length}コマ</span>`;
  wrap.appendChild(head);

  const rows = PERIODS.map(p => ({label:`${p.n}限`, start:p.start, end:p.end}));
  const todayIdx = todayDaysIndex();

  const table = document.createElement("table");
  table.className = "grid";

  const thead = document.createElement("thead");
  thead.innerHTML = "<tr><th>時限</th>" + DAYS.map((d,i)=>
    `<th class="${i===todayIdx ? "today" : ""}">${d}</th>`).join("") + "</tr>";
  table.appendChild(thead);

  const tbody = document.createElement("tbody");
  const skip = DAYS.map(()=>0);

  const findMatch = (day,row) =>
    roomEntries.find(e => e.day === day && e.start === row.start && e.end === row.end);
  const key = m => m ? (m.content + "||" + m.owner) : null;

  rows.forEach((row, rowIdx) => {
    const tr = document.createElement("tr");

    const tCell = document.createElement("td");
    tCell.className = "timecol";
    tCell.innerHTML = `<span class="p">${row.label}</span><span class="t">${row.start}<br>${row.end}</span>`;
    tr.appendChild(tCell);

    DAYS.forEach((d, i) => {
      if(skip[i] > 0){ skip[i]--; return; }

      const match = findMatch(d, row);
      let rowSpan = 1;

      // 連続する時限で同じ授業が続く場合はまとめる
      if(match){
        const k = key(match);
        let j = rowIdx + 1;
        while(j < rows.length && key(findMatch(d, rows[j])) === k){ rowSpan++; j++; }
        if(rowSpan > 1) skip[i] = rowSpan - 1;
      }

      const td = document.createElement("td");
      td.className = (i===todayIdx ? "today-col " : "") + (match ? "filled" : "empty-cell");
      if(rowSpan > 1) td.rowSpan = rowSpan;
      if(match){
        td.innerHTML = `<div class="cell-title">${escapeHtml(match.content) || "利用あり"}</div>` +
          (match.owner ? `<div class="cell-owner">${escapeHtml(match.owner)}</div>` : "");
      }else{
        td.textContent = "—";
      }
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  const box = document.createElement("div");
  box.className = "table-wrap";
  box.appendChild(table);
  wrap.appendChild(box);
}

/* =========================================================
   タブ
========================================================= */
function setupTabs(){
  document.querySelectorAll("#tabs .seg-btn").forEach(btn => {
    btn.addEventListener("click", ()=>{
      document.querySelectorAll("#tabs .seg-btn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      document.querySelectorAll(".panel").forEach(p=>{ p.hidden = true; });
      document.getElementById(btn.dataset.panel).hidden = false;
    });
  });
}

function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[ch]));
}

/* =========================================================
   初期化
========================================================= */
function init(){
  viewDayIndex = todayDaysIndex();
  viewTime = nowHM();
  setupTabs();
  setupPickers();
  setupSearch();
  setupClassSearch();
  setupStatusFilter();
  setupBuildingFilter();
  setupPeriodFilter();
  setupViewMode();
  updateModeLabel();
  tickClock();
  setInterval(tickClock, 1000);
  loadSchedule();
}
init();
</script>
